<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jiffle - Personal Media Curation</title>
  <meta name="description" content="Jiffle is a local-first visual library for importing and curating images and videos.">
  <link rel="stylesheet" href="/app-assets/styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">J</span><span>Jiffle</span></div>
      <nav id="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-view="library"><i data-lucide="images"></i><span>Library</span></button>
        <button class="nav-item" data-view="import"><i data-lucide="upload"></i><span>Import</span></button>
        <button class="nav-item" data-view="review"><i data-lucide="list-checks"></i><span>Review</span><b id="reviewCount"></b></button>
        <button class="nav-item" data-view="duplicates"><i data-lucide="copy"></i><span>Duplicates</span></button>
        <button class="nav-item" data-view="collections"><i data-lucide="folders"></i><span>Collections</span></button>
        <button class="nav-item settings-link" data-view="settings"><i data-lucide="settings"></i><span>Settings</span></button>
      </nav>
    </aside>
    <header class="topbar">
      <div><h1 id="viewTitle">Library</h1><span id="viewMeta"></span></div>
      <div id="headerActions"></div>
    </header>
    <section id="workspace" class="workspace" aria-live="polite"></section>
    <footer class="statusbar"><span id="statusText">Ready</span><span id="jobStatus"></span></footer>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/app-assets/app.js"></script>
</body>
</html>
